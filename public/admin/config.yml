# yaml-language-server: $schema=https://unpkg.com/@sveltia/cms/schema/sveltia-cms.json

backend:
  name: github
  repo: YouhuiWang/personal_page
  branch: main
  # OAuth 登录：Sveltia CMS Authenticator（Cloudflare Workers）
  base_url: https://sveltia-cms-auth.wyh-sz2516001.workers.dev

media_folder: public/images
public_folder: /personal_page/images

i18n:
  structure: multiple_folders
  locales: [zh, en]
  default_locale: zh

collections:
  - name: blog
    label: 博客文章
    label_singular: 文章
    folder: src/content/blog
    i18n: true
    create: true
    extension: md
    format: yaml-frontmatter
    slug: '{{slug}}'
    summary: '{{title}} — {{pubDate}}'
    fields:
      - { label: 标题, name: title, widget: string }
      - { label: 摘要, name: description, widget: text }
      - { label: 发布日期, name: pubDate, widget: datetime, format: 'YYYY-MM-DD', date_format: 'YYYY-MM-DD', time_format: false }
      - { label: 更新日期, name: updatedDate, widget: datetime, format: 'YYYY-MM-DD', date_format: 'YYYY-MM-DD', time_format: false, required: false }
      - label: 标签
        name: tags
        required: false
        widget: list
        field: { label: 标签, name: tag, widget: string }
      - { label: 草稿（不发布）, name: draft, widget: boolean, required: false, default: false }

  - name: projects
    label: 作品
    label_singular: 作品
    folder: src/content/projects
    create: true
    extension: yaml
    format: yaml
    slug: '{{slug}}'
    summary: '{{title.zh}}'
    fields:
      - name: title
        label: 标题
        widget: object
        fields:
          - { label: 中文, name: zh, widget: string }
          - { label: English, name: en, widget: string }
      - name: description
        label: 描述
        widget: object
        fields:
          - { label: 中文, name: zh, widget: text }
          - { label: English, name: en, widget: text }
      - { label: 链接, name: url, widget: string }
      - label: 标签
        name: tags
        required: false
        widget: list
        field: { label: 标签, name: tag, widget: string }
      - { label: 日期（用于排序）, name: date, widget: datetime, format: 'YYYY-MM-DD', date_format: 'YYYY-MM-DD', time_format: false }

  - name: links
    label: 链接
    label_singular: 链接
    folder: src/content/links
    create: true
    extension: yaml
    format: yaml
    slug: '{{slug}}'
    summary: '{{label}}'
    fields:
      - { label: 名称, name: label, widget: string }
      - name: description
        label: 描述
        widget: object
        fields:
          - { label: 中文, name: zh, widget: text }
          - { label: English, name: en, widget: text }
      - { label: URL, name: url, widget: string }
      - { label: 排序（小的在前）, name: order, widget: number, required: false, default: 0 }

singletons:
  - name: chatSettings
    label: AI 对话设置
    file: src/content/chat-settings/settings.json
    format: json
    fields:
      - label: 模型白名单
        name: models
        widget: list
        hint: 允许在对话页选择的模型，保存后约 1 分钟内生效
        field: { label: 模型, name: model, widget: string }
      - label: 思考档位
        name: efforts
        widget: list
        hint: 思考档位选项，off 表示关闭思考
        field: { label: 档位, name: effort, widget: select, options: [off, low, high, max] }
      - { label: 默认模型, name: defaultModel, widget: string, hint: 必须是上方白名单之一 }
      - { label: 默认思考档位, name: defaultEffort, widget: select, options: [off, low, high, max] }
      - { label: 最大输出 tokens, name: maxOutputTokens, widget: number, min: 256, max: 8192 }
      - label: 每 IP 限流
        name: rateLimit
        widget: object
        fields:
          - { label: 窗口内最大请求数, name: limit, widget: number, min: 1 }
          - { label: 窗口时长（秒）, name: periodSeconds, widget: number, min: 5 }
      - label: 欢迎语
        name: welcome
        widget: object
        fields:
          - { label: 中文, name: zh, widget: text }
          - { label: English, name: en, widget: text }
      - label: API Key
        name: apiKey
        widget: apikey
        hint: 此字段不会写入仓库（始终为掩码占位符），点击"保存到 Worker"后写入 Cloudflare KV

  - name: profile
    label: 个人信息
    file: src/content/profile/profile.yaml
    fields:
      - { label: 姓名, name: name, widget: string }
      - name: bio
        label: 简介
        widget: object
        fields:
          - { label: 中文, name: zh, widget: text }
          - { label: English, name: en, widget: text }
      - { label: 所在地, name: location, widget: string }
      - { label: Email, name: email, widget: string }
      - { label: GitHub, name: github, widget: string }
      - label: 社交链接
        name: socials
        widget: list
        summary: '{{label}}'
        fields:
          - { label: 名称, name: label, widget: string }
          - { label: URL, name: url, widget: string }
          - { label: 图标, name: icon, widget: select, options: [github, mail, x, linkedin, rss] }
